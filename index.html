<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>琉璃鏡 ． 命理全整合系統</title>
    <style>
        :root { --bg: #0b0c10; --card: #1f2833; --gold: #c5a059; --text: #ffffff; --danger: #e74c3c; }
        body { font-family: 'PingFang TC', sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        h1 { color: var(--gold); letter-spacing: 2px; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 20px; text-align: center; }
        .container { width: 100%; max-width: 500px; background: var(--card); padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box; }
        
        /* 🃏 塔羅牌區 */
        .tarot-card { width: 100%; max-width: 500px; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px dashed var(--gold); text-align: center; background: rgba(0,0,0,0.3); }
        .tarot-title { font-size: 1.1rem; color: var(--gold); margin-bottom: 15px; font-weight: bold; letter-spacing: 1px; }
        
        /* 🌈 彩虹卡設計 */
        .rainbow-card { width: 100%; max-width: 500px; padding: 20px 25px; border-radius: 12px; margin-bottom: 25px; box-sizing: border-box; border: 1px solid rgba(255, 255, 255, 0.15); text-align: center; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); transition: background 0.5s ease; }
        .rainbow-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 3px; color: #ffffff; margin-bottom: 10px; font-weight: bold; opacity: 0.9; }
        .rainbow-text { font-size: 1.1rem; line-height: 1.6; color: #ffffff; font-style: italic; font-weight: 300; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

        .user-type-selector { display: flex; justify-content: space-around; margin-bottom: 20px; background: #0b0c10; padding: 5px; border-radius: 8px; }
        .user-type-selector button { background: none; border: none; color: #888; padding: 10px; cursor: pointer; font-size: 1rem; width: 50%; transition: 0.3s; }
        .user-type-selector button.active { background: var(--gold); color: #0b0c10; border-radius: 6px; font-weight: bold; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; color: var(--gold); font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; background: #0b0c10; border: 1px solid rgba(197, 160, 89, 0.2); border-radius: 8px; color: white; font-size: 1rem; box-sizing: border-box; }
        select { appearance: none; -webkit-appearance: none; cursor: pointer; }
        
        .name-row, .date-row { display: flex; gap: 10px; align-items: center; }
        .date-row input { text-align: center; }
        .delete-btn { background: rgba(231, 76, 60, 0.15); border: 1px solid var(--danger); color: var(--danger); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; display: none; }

        .system-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
        .sys-btn { padding: 15px 5px; background: #151c24; border: 1px solid var(--gold); border-radius: 10px; color: var(--gold); font-size: 0.95rem; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .sys-btn:hover:not(.disabled) { background: var(--gold); color: #0b0c10; }
        .sys-btn.disabled { background: #121212; border-color: #353535; color: #353535; cursor: not-allowed; }
        .fusion-btn { grid-column: span 2; background: linear-gradient(135deg, #151c24, #2c1a3a); border-color: var(--fusion-color); color: #e2b3ff; }

        #result-box { margin-top: 25px; padding: 20px; background: #151c24; border-left: 4px solid var(--gold); border-radius: 5px; display: none; line-height: 1.6; }
        .res-title { color: #ffeb3b; font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 5px; }
        .res-content { color: #e0e0e0; font-size: 0.95rem; text-align: justify; margin-bottom: 10px; }
        
        .line-badge { display: inline-block; background: rgba(197, 160, 89, 0.15); color: var(--gold); padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; margin: 3px; border: 1px solid rgba(197, 160, 89, 0.3); }
        .high-freq { color: #2ecc71; font-weight: bold; }
        .low-freq { color: #e74c3c; font-weight: bold; }
    </style>
</head>

                        saveToLocal();
                    } else if (curMode === 'sub' && curSubName && curSubName !== "_NEW_") {
                        const keys = ['year', 'month', 'day', 'hour', 'minute'];
                        db.subList[curSubName][keys[idx]] = val;
                        saveToLocal();
                    }
                    checkReady();
                });
            });

            // 刪除親友檔案
            document.getElementById('btn-del').addEventListener('click', () => {
                if(curSubName && confirm(`確定刪除 ${curSubName} 的專屬資料嗎？`)) {
                    delete db.subList[curSubName];
                    curSubName = ''; 
                    saveToLocal(); 
                    updateUI();
                    document.getElementById('result-box').style.display = 'none';
                }
            });

            // 核心解析按鈕
            document.getElementById('btn-num').addEventListener('click', calcLifeNum);
            document.getElementById('btn-fusion').addEventListener('click', calcFusionAll);
            document.getElementById('btn-mbti').addEventListener('click', () => showPlaceholder("🧠 MBTI 靈魂人格"));
            document.getElementById('btn-astro').addEventListener('click', () => showPlaceholder("🌌 星座星盤"));
            document.getElementById('btn-bazi').addEventListener('click', () => showPlaceholder("🔥 生辰八字"));
            document.getElementById('btn-ziwei').addEventListener('click', () => showPlaceholder("👑 紫微斗數"));

            // 初次載入畫面
            updateUI();
        };
    </script>
</body>
</html>
