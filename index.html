<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>琉璃鏡 ． 命理全整合系統</title>
    <style>
        :root { --bg: #0b0c10; --card: #1f2833; --gold: #c5a059; --text: #ffffff; --danger: #e74c3c; }
        body { font-family: 'PingFang TC', sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        h1 { color: var(--gold); letter-spacing: 2px; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 20px; text-align: center; }
        .container { width: 100%; max-width: 500px; background: var(--card); padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box; }
        
        /* 🃏 塔羅牌區 */
        .tarot-card { width: 100%; max-width: 500px; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px dashed var(--gold); text-align: center; background: rgba(0,0,0,0.3); }
        .tarot-title { font-size: 1.1rem; color: var(--gold); margin-bottom: 15px; font-weight: bold; letter-spacing: 1px; }
        
        /* 🌈 彩虹卡設計 */
        .rainbow-card { width: 100%; max-width: 500px; padding: 20px 25px; border-radius: 12px; margin-bottom: 25px; box-sizing: border-box; border: 1px solid rgba(255, 255, 255, 0.15); text-align: center; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); transition: background 0.5s ease; }
        .rainbow-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 3px; color: #ffffff; margin-bottom: 10px; font-weight: bold; opacity: 0.9; }
        .rainbow-text { font-size: 1.1rem; line-height: 1.6; color: #ffffff; font-style: italic; font-weight: 300; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

        /* 使用者切換 */
        .user-type-selector { display: flex; justify-content: space-around; margin-bottom: 20px; background: #0b0c10; padding: 5px; border-radius: 8px; }
        .user-type-selector button { background: none; border: none; color: #888; padding: 10px; cursor: pointer; font-size: 1rem; width: 50%; transition: 0.3s; }
        .user-type-selector button.active { background: var(--gold); color: #0b0c10; border-radius: 6px; font-weight: bold; }

        /* 表單設計 */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; color: var(--gold); font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; background: #0b0c10; border: 1px solid rgba(197, 160, 89, 0.2); border-radius: 8px; color: white; font-size: 1rem; box-sizing: border-box; }
        select { appearance: none; -webkit-appearance: none; cursor: pointer; }
        .name-row, .date-row { display: flex; gap: 10px; align-items: center; }
        .date-row input { text-align: center; }
        .delete-btn { background: rgba(231, 76, 60, 0.15); border: 1px solid var(--danger); color: var(--danger); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; display: none; transition: 0.2s; }
        .delete-btn:hover { background: var(--danger); color: white; }

        /* 系統按鈕 */
        .system-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
        .sys-btn { padding: 15px 5px; background: #151c24; border: 1px solid var(--gold); border-radius: 10px; color: var(--gold); font-size: 0.95rem; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .sys-btn:hover:not(.disabled) { background: var(--gold); color: #0b0c10; }
        .sys-btn.disabled { background: #121212; border-color: #353535; color: #353535; cursor: not-allowed; }
        .fusion-btn { grid-column: span 2; background: linear-gradient(135deg, #151c24, #2c1a3a); border-color: #9b59b6; color: #e2b3ff; }

        /* 解析結果區 */
        #result-box { margin-top: 25px; padding: 20px; background: #151c24; border-left: 4px solid var(--gold); border-radius: 5px; display: none; line-height: 1.6; width: 100%; max-width: 500px; box-sizing: border-box;}
        .res-title { color: #ffeb3b; font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 5px; }
        .res-content { color: #e0e0e0; font-size: 0.95rem; text-align: justify; margin-bottom: 10px; white-space: pre-line; }
        .line-badge { display: inline-block; background: rgba(197, 160, 89, 0.15); color: var(--gold); padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; margin: 3px; border: 1px solid rgba(197, 160, 89, 0.3); }

        /* MBTI 測驗專區 */
        .quiz-container { background: #0b0c10; padding: 20px; border-radius: 10px; border: 1px solid var(--gold); text-align: center; }
        .quiz-progress { font-size: 0.8rem; color: #888; margin-bottom: 15px; letter-spacing: 2px; }
        .quiz-question { font-size: 1.1rem; color: #fff; margin-bottom: 25px; line-height: 1.5; font-weight: bold; }
        .quiz-opt { display: block; width: 100%; padding: 15px; background: #1f2833; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e0e0e0; font-size: 0.95rem; cursor: pointer; margin-bottom: 12px; transition: 0.3s; text-align: left; }
        .quiz-opt:hover { background: rgba(197, 160, 89, 0.2); border-color: var(--gold); }
        .quiz-back-btn { width: 100%; padding: 12px; background: transparent; border: 1px dashed #888; color: #aaa; border-radius: 8px; margin-top: 10px; cursor: pointer; transition: 0.3s; }
        .quiz-back-btn:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: #fff; }
    </style>
</head>

            else if ((m === 12 && d >= 22) || (m === 1 && d <= 19)) sunIdx = 9;
            else if ((m === 1 && d >= 20) || (m === 2 && d <= 18)) sunIdx = 10;
            else if ((m === 2 && d >= 19) || (m === 3 && d <= 20)) sunIdx = 11;
            
            let totalMins = (hh * 60 + mm) - (6 * 60);
            if(totalMins < 0) totalMins += 1440; 
            let ascIdx = (sunIdx + Math.floor((totalMins / 4) / 30)) % 12;
            const sunSign = astroDB[sunIdx].name;
            const ascSign = astroDB[ascIdx].name;

            // 紫微
            const hash = (y * 31 + m * 17 + d * 7 + hh * 3) % 14;
            const mainStar = ziweiStarsDB[hash].name;

            const html = `
                <h3 style="color:#ffeb3b; text-align:center;">✨ 琉璃大融合 ． 靈魂全景剖析</h3>
                <p class="res-content">這是一份橫跨東西方神祕學的終極報告。我們將 <b>${name}</b> 的所有數據匯聚於琉璃鏡中，折射出你最深層的模樣：</p>
                
                <span class="res-title">1️⃣ 靈數與八字基底 (${sum}號人 ⨯ ${dayMaster})</span>
                <div class="res-content">西方靈數賦予你<b>「${numRole}」</b>的行為動機，東方八字揭示你的靈魂本質是一團<b>「${dayMaster}」</b>。中西合璧的能量，構成了你不屈不撓的生命原動力。</div>

                <span class="res-title">2️⃣ 心智操作系統 (MBTI: ${mbti})</span>
                <div class="res-content">如果先天命格是硬體，那麼 <b>${mbti}</b> 便是你的軟體。它細緻地決定了你如何處理情感、吸收資訊，以及與世界建立安全的邊界。</div>

                <span class="res-title">3️⃣ 星象與紫微流年 (太陽${sunSign}/上升${ascSign} ⨯ ${mainStar})</span>
                <div class="res-content">西洋星盤中你以<b>${sunSign}</b>為核心、戴著<b>${ascSign}</b>的面具面對世界；而紫微斗數中，你是<b>${mainStar}</b>坐命，這精準定錨了你的人生舞台與需要跨越的業力盲點。</div>

                <span class="res-title">🔮 琉璃終極指引</span>
                <div class="res-content">你絕非單一的標籤可以被定義。當你的<b>命理天賦</b>、<b>心智邏輯</b>與<b>五行能量</b>交織，意味著你不論面對何種困境，都擁有一套獨一無二的破解機制。請相信直覺，勇敢走上專屬的花路吧！</div>
            `;
            showResult(html);
        }

        // ==========================================
        // 頁面載入與事件綁定 (採用最穩定的 DOMContentLoaded)
        // ==========================================
        document.addEventListener("DOMContentLoaded", function() {
            // 塔羅牌按鈕
            document.getElementById('btn-tarot').addEventListener('click', drawTarot);

            // 隨機彩虹卡
            const randIdx = Math.floor(Math.random() * rainbowQuotes.length);
            const quoteData = rainbowQuotes[randIdx];
            document.getElementById('rainbow-quote').innerText = `「${quoteData.text}」`;
            document.getElementById('rainbow-card-bg').style.background = `linear-gradient(135deg, #1f2833 10%, ${quoteData.color}99)`;

            // 本地儲存讀取
            const saved = localStorage.getItem('prism_v_final');
            if(saved) {
                db = JSON.parse(saved);
                if(!db.main) db.main = {};
                if(!db.subList) db.subList = {};
            }

            // 使用者模式切換
            document.getElementById('mode-main').addEventListener('click', () => {
                curMode = 'main';
                document.getElementById('mode-main').classList.add('active');
                document.getElementById('mode-sub').classList.remove('active');
                document.getElementById('result-box').style.display = 'none';
                updateUI();
            });

            document.getElementById('mode-sub').addEventListener('click', () => {
                curMode = 'sub';
                document.getElementById('mode-sub').classList.add('active');
                document.getElementById('mode-main').classList.remove('active');
                document.getElementById('result-box').style.display = 'none';
                curSubName = ''; 
                updateUI();
            });

            // 親友選單
            document.getElementById('sub-user-select').addEventListener('change', (e) => {
                const val = e.target.value;
                if(val === "_NEW_") { curSubName = ''; } else { curSubName = val; }
                document.getElementById('result-box').style.display = 'none';
                updateUI();
            });

            // 名稱輸入監聽
            document.getElementById('in-name').addEventListener('input', (e) => {
                const val = e.target.value.trim();
                if (curMode === 'main') { db.main.name = val; saveToLocal(); }
            });
            document.getElementById('in-name').addEventListener('change', (e) => {
                const val = e.target.value.trim();
                if (curMode === 'sub' && val !== "") {
                    curSubName = val;
                    if(!db.subList[val]) db.subList[val] = { name: val, year:"", month:"", day:"", hour:"", minute:"" };
                    saveToLocal();
                    updateUI(); 
                }
            });

            // 日期輸入監聽
            const inputs = ['in-y', 'in-m', 'in-d', 'in-hh', 'in-mm'];
            inputs.forEach((id, idx) => {
                document.getElementById(id).addEventListener('input', (e) => {
                    const val = e.target.value;
                    if(val.length >= e.target.maxLength && idx < inputs.length-1) {
                        document.getElementById(inputs[idx+1]).focus();
                    }
                    if (curMode === 'main') {
                        const keys = ['year', 'month', 'day', 'hour', 'minute'];
                        db.main[keys[idx]] = val;
                        saveToLocal();
                    } else if (curMode === 'sub' && curSubName && curSubName !== "_NEW_") {
                        const keys = ['year', 'month', 'day', 'hour', 'minute'];
                        db.subList[curSubName][keys[idx]] = val;
                        saveToLocal();
                    }
                    checkReady();
                });
            });

            // 刪除親友
            document.getElementById('btn-del').addEventListener('click', () => {
                if(curSubName && confirm(`確定刪除 ${curSubName} 的專屬資料嗎？`)) {
                    delete db.subList[curSubName];
                    curSubName = ''; 
                    saveToLocal(); 
                    updateUI();
                    document.getElementById('result-box').style.display = 'none';
                }
            });

            // 全模組按鈕解封綁定 (真正的大解禁！)
            document.getElementById('btn-num').addEventListener('click', calcLifeNum);
            document.getElementById('btn-mbti').addEventListener('click', startMBTITest);
            document.getElementById('btn-astro').addEventListener('click', calcAstro);
            document.getElementById('btn-ziwei').addEventListener('click', calcZiwei);
            document.getElementById('btn-bazi').addEventListener('click', calcBazi);
            document.getElementById('btn-fusion').addEventListener('click', calcFusionAll);

            updateUI();
        });
    </script>
</body>
</html>
