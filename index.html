        // 計算邏輯：直接讀取年月日加總
        function runNumerology() {
            const y = document.getElementById('in-y').value;
            const m = document.getElementById('in-m').value;
            const d = document.getElementById('in-d').value;
            if(!y || !m || !d) { alert("請先填寫生日"); return; }
            
            let sum = (y + m + d).split('').reduce((a, b) => a + parseInt(b), 0);
            while (sum > 9) { 
                sum = sum.toString().split('').reduce((a, b) => a + parseInt(b), 0); 
            }

            const res = numerologyDB[sum];
            const name = document.getElementById('username').value;
            
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('result-box').innerHTML = `
                <h3>🔮 ${name} 的生命靈數報告</h3>
                <span class="res-title">宇宙定錨：你是 ${sum} 號人 ( ${res.role} )</span>
                <p>${res.traits}</p>
                <span class="res-title">核心天賦</span><p>${res.talent}</p>
                <span class="res-title">水晶保養建議</span><p>${res.crystal}</p>
                <span class="res-title">人生課題</span><p>${res.tip}</p>
            `;
        }
